name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w agent-activity-kit
      - run: npm run typecheck
      - run: npx next build
      - name: Check package contents
        run: npm pack --dry-run -w agent-activity-kit
